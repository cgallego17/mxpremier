{% extends 'backoffice/base.html' %}
{% load i18n %}
{% block title %}{% trans "Delete Partner" %}{% endblock %}
{% block content %}
<div class="card shadow-sm" style="max-width:480px">
  <div class="card-body p-4 text-center">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2.5rem"></i>
    <h5 class="mt-3">{% trans "Delete partner?" %}</h5>
    <p class="text-muted">{{ partner.nombre }}</p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash me-1"></i>{% trans "Yes, delete" %}
        </button>
      </form>
      <a href="{% url 'backoffice:partners_lista' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
    </div>
  </div>
</div>
{% endblock %}
