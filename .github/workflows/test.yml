name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-secret-key-not-used-in-production-abcdefghijklmnopqrstuvwxyz"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost"
      FB_PAGE_ID: "000000000000000"
      FB_PAGE_ACCESS_TOKEN: "fake-token-for-ci"
      FB_PAGE_URL: "https://www.facebook.com/test"
      FB_REELS_URL: "https://www.facebook.com/test/reels/"
      SECURE_SSL_REDIRECT: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --verbosity=2

      - name: Django deploy check
        run: python manage.py check --deploy
