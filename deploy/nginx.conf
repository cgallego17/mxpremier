# /etc/nginx/sites-available/mxbaseball
# Certbot agregará los bloques SSL automáticamente al correr setup.sh

server {
    listen 80;
    server_name mxbaseball.com www.mxbaseball.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mxbaseball.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mxbaseball.com;

    ssl_certificate     /etc/letsencrypt/live/mxbaseball.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mxbaseball.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mxbaseball.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mxbaseball.com;

    ssl_certificate     /etc/letsencrypt/live/mxbaseball.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mxbaseball.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/mxbaseball/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/mxbaseball/media/;
        expires 7d;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
