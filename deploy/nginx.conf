# /etc/nginx/sites-available/mxbaseball

# Gzip
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/xml image/svg+xml
    font/woff font/woff2;

server {
    listen 80;
    server_name mxbaseball.com www.mxbaseball.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mxbaseball.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mxbaseball.com;

    ssl_certificate     /etc/letsencrypt/live/mxbaseball.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mxbaseball.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mxbaseball.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mxbaseball.com;

    ssl_certificate     /etc/letsencrypt/live/mxbaseball.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mxbaseball.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Archivos estáticos — caché agresivo (contenido inmutable por hash)
    location /static/ {
        alias /var/www/mxbaseball/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media — caché moderado
    location /media/ {
        alias /var/www/mxbaseball/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy a Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      16 8k;
    }
}
